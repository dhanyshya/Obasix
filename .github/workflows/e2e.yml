name: Checks and E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (local database) needs Node 22.13 or later.
          node-version: 24
          cache: npm

      - run: npm ci

      # LayoutProps and route types are generated by Next.js; create them before type-checking.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npx eslint src e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Starts its own dev server in demo mode with a throwaway database (see playwright.config.ts).
      - name: End-to-end tests (desktop, tablet, mobile)
        run: npx playwright test

      # Payments, email and AI against a local stand-in for Razorpay, Resend and Claude.
      # Runs after the main suite: Next.js allows one dev server per project folder.
      - name: Integration tests (Razorpay, Resend, Claude stand-in)
        run: npm run test:e2e:integrations

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload integration report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integrations
          path: playwright-report-integrations/
          retention-days: 14

      - name: Upload failure traces and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            test-results-integrations/
          retention-days: 14

  # Firefox and WebKit, one job each, on clean runners. Same suite as above minus the
  # mobile-only spec (see the opt-in projects in playwright.config.ts).
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          E2E_ALL_BROWSERS: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14

  # The same desktop suite against `next build` + `next start`, the way the site is served for real:
  # catches build-only failures and differences the dev server hides.
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build)
        run: npm run test:e2e:production

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-production
          path: test-results/
          retention-days: 14
