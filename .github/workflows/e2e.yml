name: Checks and E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (local database) needs Node 22.13 or later.
          node-version: 24
          cache: npm

      - run: npm ci

      # LayoutProps and route types are generated by Next.js; create them before type-checking.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npx eslint src e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Starts its own dev server in demo mode with a throwaway database (see playwright.config.ts).
      - name: End-to-end tests (desktop, tablet, mobile)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
